      <stop offset="30%" stop-color="#1a0a3a"/>
      <stop offset="70%" stop-color="#0a0520"/>
      <stop offset="100%" stop-color="#050210"/>
    </radialGradient>
    <radialGradient id="portalOuter" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7b2ff7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#7b2ff7" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#ff00ff" stop-opacity="0.5"/>
      <stop offset="85%" stop-color="#00ffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
    </radialGradient>
    <radialGradient id="portalInner" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="20%" stop-color="#00ffff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#ff00ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7b2ff7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
