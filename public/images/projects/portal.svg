    <line x1="250" y1="80" x2="300" y2="140" stroke="#ff00ff" stroke-width="1" opacity="0.6"/>
    <line x1="550" y1="80" x2="500" y2="140" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
    <line x1="150" y1="350" x2="280" y2="280" stroke="#7b2ff7" stroke-width="1" opacity="0.5"/>
    <line x1="650" y1="350" x2="520" y2="280" stroke="#00ffff" stroke-width="1" opacity="0.5"/>
