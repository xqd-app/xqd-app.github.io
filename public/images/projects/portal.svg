    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bgCenter)"/>
  
  <g opacity="0.6">
