  <text x="400" y="420" text-anchor="middle" fill="#b794f6" font-size="28" font-family="'Segoe UI', sans-serif" font-weight="bold" opacity="0.9" filter="url(#glow)">DIMENSION PORTAL</text>
  <text x="400" y="420" text-anchor="middle" fill="#e0d0ff" font-size="28" font-family="'Segoe UI', sans-serif" font-weight="bold">DIMENSION PORTAL</text>
