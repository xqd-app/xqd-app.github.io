<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>高中信息技术 · 可编辑知识时间线</title>
<style>
  :root {
    --bg: #0a0a0f;
    --purple: #8b5cf6;
    --pink: #ec4899;
    --accent: #a78bfa;
    --text: #ffffff;
    --muted: #c4c4d4;
    --card: rgba(20, 20, 35, 0.82);
    --card-2: #1a1a2e;
    --line-grad: linear-gradient(to bottom, #8b5cf6, #ec4899);
    --glow: rgba(139, 92, 246, 0.2);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    background-attachment: fixed;
    color: var(--text);
    padding: 0 16px 60px;
    line-height: 1.6;
  }

  .toolbar {
    position: sticky; top: 0; z-index: 50;
    max-width: 800px; margin: 0 auto;
    padding: 14px 0;
    background: linear-gradient(180deg, rgba(10,10,15,0.95) 60%, rgba(10,10,15,0));
    backdrop-filter: blur(6px);
  }
  .toolbar-inner {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    background: rgba(20,20,35,0.7);
    border: 1px solid rgba(139,92,246,0.25);
    border-radius: 14px; padding: 10px 12px;
    box-shadow: 0 0 20px rgba(139,92,246,0.12);
  }
  .search-box { position: relative; flex: 1 1 220px; }
  .search-box svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--accent); }
  .search-box input {
    width: 100%; padding: 9px 12px 9px 34px;
    background: #12121e; color: var(--text);
    border: 1px solid rgba(139,92,246,0.3); border-radius: 10px;
    outline: none; font-size: 14px;
    transition: border-color .2s, box-shadow .2s;
  }
  .search-box input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(139,92,246,0.25); }
  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 8px 12px; font-size: 13px; cursor: pointer;
    color: #e9e4ff; background: rgba(139,92,246,0.14);
    border: 1px solid rgba(139,92,246,0.35); border-radius: 10px;
    transition: all .2s ease; white-space: nowrap;
  }
  .btn:hover { background: rgba(139,92,246,0.28); box-shadow: 0 0 12px rgba(139,92,246,0.35); transform: translateY(-1px); }
  .btn svg { width: 14px; height: 14px; }
  .btn.ghost { background: transparent; }

  .app { max-width: 800px; margin: 0 auto; }

  .timeline {
    position: relative;
    padding-left: 34px;
    margin-top: 22px;
  }
  .timeline::before {
    content: '';
    position: absolute; left: 12px; top: 6px; bottom: 6px; width: 3px;
    background: var(--line-grad);
    border-radius: 3px;
    box-shadow: 0 0 12px rgba(236,72,153,0.5);
  }

  .root-card {
    position: relative;
    background: linear-gradient(135deg, #ec4899, #8b5cf6);
    color: #fff; font-weight: 700; font-size: 20px;
    padding: 18px 20px; border-radius: 16px;
    box-shadow: 0 10px 30px -8px rgba(236,72,153,0.5);
    text-align: center; letter-spacing: .5px;
    word-break: break-word;
  }
  .root-card .card-text { cursor: text; }
  .root-card .card-actions { top: 10px; }

  .node { position: relative; }
  .node .card {
    position: relative;
    background: var(--card);
    border: 1px solid rgba(139,92,246,0.22);
    border-radius: 14px;
    box-shadow: 0 0 15px var(--glow);
    transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease, opacity .3s ease;
    word-break: break-word;
  }
  .node .card:hover {
    transform: translateY(-2px);
    border-color: rgba(139,92,246,0.5);
    box-shadow: 0 0 26px rgba(139,92,246,0.4);
  }
  .node.depth-1 { margin-bottom: 14px; }
  .node.depth-1 .card { padding: 14px 16px; }

  .module-dot {
    position: absolute; left: -28px; top: 22px;
    width: 15px; height: 15px; border-radius: 50%;
    background: #fff;
    border: 3px solid var(--purple);
    box-shadow: 0 0 0 4px rgba(139,92,246,0.25), 0 0 18px rgba(236,72,153,0.8);
    z-index: 2;
  }

  .node.depth-2 .card, .node.depth-3 .card, .node.depth-4 .card,
  .node.depth-5 .card, .node.depth-6 .card {
    background: var(--card-2);
    border-color: rgba(139,92,246,0.16);
    padding: 10px 12px;
  }
  .children {
    margin-left: 14px; padding-left: 16px;
    border-left: 2px solid rgba(139,92,246,0.4);
    margin-top: 8px;
  }
  .node.depth-2 .children, .node.depth-3 .children,
  .node.depth-4 .children, .node.depth-5 .children {
    margin-left: 10px; padding-left: 12px;
  }
  .children .node { margin-bottom: 8px; }
  .children .node:last-child { margin-bottom: 0; }

  .children { overflow: hidden; }
  .node > .card { cursor: pointer; }

  .card-header { display: flex; align-items: flex-start; gap: 8px; }
  .card-text {
    flex: 1; color: var(--text); font-size: 14px;
    outline: none; cursor: text; min-height: 1.2em;
  }
  .node.depth-1 .card-text { font-weight: 600; font-size: 15px; }
  .node.depth-2 .card-text { color: #dcd7f5; }
  .node.depth-3 .card-text, .node.depth-4 .card-text,
  .node.depth-5 .card-text, .node.depth-6 .card-text { color: var(--muted); font-size: 13.5px; }
  .card-text[contenteditable="true"] {
    background: rgba(139,92,246,0.12);
    border-radius: 6px; padding: 0 4px;
    box-shadow: 0 0 0 2px rgba(139,92,246,0.5);
  }

  .meta-chip {
    display: inline-block; flex: none;
    font-size: 10px; color: rgba(167,139,250,0.75);
    background: rgba(139,92,246,0.1);
    border: 1px solid rgba(139,92,246,0.2);
    border-radius: 6px; padding: 0 5px; margin-top: 2px;
    white-space: nowrap;
  }

  .toggle-btn {
    flex: none; width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    background: #16162a; border: 1px solid var(--purple);
    border-radius: 50%; cursor: pointer; color: var(--accent);
    transition: transform .3s ease, background .2s ease;
    margin-top: -4px;
  }
  .toggle-btn:hover { background: rgba(139,92,246,0.25); }
  .toggle-btn svg { width: 16px; height: 16px; transition: transform .3s ease; }
  .toggle-btn.expanded svg { transform: rotate(90deg); }

  .card-actions {
    position: absolute; top: -12px; right: 10px;
    display: flex; gap: 4px;
    opacity: 0; transform: translateY(4px);
    transition: opacity .2s ease, transform .2s ease;
    z-index: 5;
  }
  .node .card:hover .card-actions { opacity: 1; transform: translateY(0); }
  .card-actions button {
    width: 26px; height: 26px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border: 1px solid rgba(139,92,246,0.4);
    background: #1b1b30; color: #cdc4f7;
    transition: all .15s ease;
  }
  .card-actions button svg { width: 13px; height: 13px; }
  .card-actions button:hover { transform: scale(1.12); background: rgba(139,92,246,0.3); }
  .card-actions button.add-child:hover { color: #4ade80; border-color: #4ade80; }
  .card-actions button.add-sibling:hover { color: #38bdf8; border-color: #38bdf8; }
  .card-actions button.del { color: #fca5a5; }
  .card-actions button.del:hover { color: #fff; background: #dc2626; border-color: #dc2626; }
  .card-actions button.del.confirming {
    background: #dc2626; color: #fff; border-color: #dc2626;
    animation: pulse-red .8s infinite;
  }
  @keyframes pulse-red { 50% { box-shadow: 0 0 0 5px rgba(220,38,38,0.4); } }

  .node.dragging { opacity: 0.45; }
  .node.drag-over-top::before, .node.drag-over-bottom::after {
    content: '';
    display: block; height: 3px; border-radius: 3px;
    background: var(--line-grad); margin: 2px 0;
    box-shadow: 0 0 10px rgba(236,72,153,0.8);
  }

  mark { background: rgba(167,139,250,0.45); color: #fff; border-radius: 3px; padding: 0 1px; }
  .node.dim > .card { opacity: 0.28; filter: saturate(0.4); }
  .node.match > .card {
    border-color: rgba(236,72,153,0.8);
    box-shadow: 0 0 24px rgba(236,72,153,0.5);
  }

  .drop-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(10,10,15,0.82);
    display: none; align-items: center; justify-content: center;
    border: 3px dashed var(--purple); font-size: 20px; color: var(--accent);
  }
  .drop-overlay.show { display: flex; }

  .modal-mask {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #1b1b30; border: 1px solid rgba(139,92,246,0.4);
    border-radius: 14px; padding: 22px; max-width: 360px; width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5); text-align: center;
  }
  .modal p { margin-bottom: 18px; color: var(--text); font-size: 15px; }
  .modal .modal-btns { display: flex; gap: 10px; justify-content: center; }
  .modal .btn.ok { background: #dc2626; border-color: #dc2626; }
  .modal .btn.ok:hover { background: #ef4444; }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(20,20,35,0.95); border: 1px solid var(--purple);
    color: #fff; padding: 10px 18px; border-radius: 10px;
    font-size: 14px; opacity: 0; transition: all .3s ease; z-index: 400;
    box-shadow: 0 0 20px rgba(139,92,246,0.5); pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 600px) {
    body { padding: 0 10px 40px; }
    .toolbar-inner { padding: 8px; }
    .btn { padding: 7px 9px; font-size: 12px; }
    .root-card { font-size: 17px; padding: 14px; }
    .timeline { padding-left: 28px; }
    .timeline::before { left: 9px; }
    .module-dot { left: -24px; top: 20px; }
  }
</style>
</head>

let data = null;
let expanded = new Set();
let autoExpand = new Set();
let searchTerm = '';
let idCounter = 0;

const treeEl = document.getElementById('tree');

function normalize(node, parentId) {
  node._id = 'n' + (++idCounter);
  node._parentId = parentId || null;
  node.children = node.children || [];
  node.children.forEach(c => normalize(c, node._id));
  return node;
}
function strip(node) {
  const out = { content: node.content, children: node.children.map(strip) };
  if (node.payload) out.payload = node.payload;
  return out;
}
function findById(node, id) {
  if (node._id === id) return node;
  for (const c of node.children) {
    const r = findById(c, id);
    if (r) return r;
  }
  return null;
}
function findParent(node, id) {
  for (const c of node.children) {
    if (c._id === id) return node;
    const r = findParent(c, id);
    if (r) return r;
  }
  return null;
}
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function highlight(text) {
  const esc = escapeHtml(text);
  if (!searchTerm) return esc;
  const term = escapeHtml(searchTerm);
  if (!term) return esc;
  const re = new RegExp('(' + escapeRegExp(term) + ')', 'gi');
  return esc.replace(re, '<mark>$1</mark>');
}
function subtreeHas(node) {
  if (node.content.toLowerCase().includes(searchTerm)) return true;
  return node.children.some(subtreeHas);
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const parsed = JSON.parse(raw); if (parsed && parsed.content) return normalize(parsed, null); }
  } catch (e) { /* ignore */ }
  return normalize(JSON.parse(JSON.stringify(DEFAULT_DATA)), null);
}
function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(strip(data)));
  } catch (e) { toast('保存失败：' + e.message); return; }
}

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}
function confirmDialog(msg, onOk) {
  document.getElementById('modalMsg').textContent = msg;
  document.getElementById('modalMask').classList.add('show');
  const ok = document.getElementById('modalOk');
  const cancel = document.getElementById('modalCancel');
  const done = (res) => {
    document.getElementById('modalMask').classList.remove('show');
    ok.onclick = null; cancel.onclick = null;
    if (res) onOk();
  };
  ok.onclick = () => done(true);
  cancel.onclick = () => done(false);
}

function buildChildren(node, depth) {
  const wrap = document.createElement('div');
  wrap.className = 'children';
  node.children.forEach(c => renderNode(c, depth + 1, wrap));
  return wrap;
}

function renderNode(node, depth, container) {
  const wrap = document.createElement('div');
  wrap.className = 'node depth-' + depth;
  wrap.draggable = true;
  wrap.dataset.id = node._id;
  wrap.dataset.parentId = node._parentId || 'root';

  if (searchTerm) {
    if (!subtreeHas(node)) wrap.classList.add('dim');
    else if (node.content.toLowerCase().includes(searchTerm)) wrap.classList.add('match');
  }

  const card = document.createElement('div');
  card.className = 'card';

  if (depth === 1) {
    const dot = document.createElement('span');
    dot.className = 'module-dot';
    card.appendChild(dot);
  }

  const header = document.createElement('div');
  header.className = 'card-header';

  const hasChildren = node.children.length > 0;
  const isExpanded = hasChildren && (expanded.has(node._id) || autoExpand.has(node._id));
  if (hasChildren) {
    const tb = document.createElement('button');
    tb.className = 'toggle-btn' + (isExpanded ? ' expanded' : '');
    tb.innerHTML = ICONS.arrow;
    tb.title = isExpanded ? '折叠' : '展开';
    tb.addEventListener('click', (e) => { e.stopPropagation(); toggleNode(node._id); });
    header.appendChild(tb);
  }

  const text = document.createElement('span');
  text.className = 'card-text';
  text.innerHTML = highlight(node.content);
  text.title = '双击编辑';
  text.addEventListener('dblclick', (e) => { e.stopPropagation(); startEdit(text, node); });
  header.appendChild(text);

  if (node.payload && node.payload.tag) {
    const meta = document.createElement('span');
    meta.className = 'meta-chip';
    meta.textContent = node.payload.tag + (node.payload.lines ? ' · ' + node.payload.lines : '');
    header.appendChild(meta);
  }

  card.appendChild(header);

  const actions = document.createElement('div');
  actions.className = 'card-actions';
  const addBtn = document.createElement('button');
  addBtn.className = 'add-child';
  addBtn.innerHTML = ICONS.plus;
  addBtn.title = '添加子项';
  addBtn.addEventListener('click', (e) => { e.stopPropagation(); addChild(node); });
  actions.appendChild(addBtn);

  if (depth > 0) {
    const sibBtn = document.createElement('button');
    sibBtn.className = 'add-sibling';
    sibBtn.innerHTML = ICONS.sibling;
    sibBtn.title = '添加同级';
    sibBtn.addEventListener('click', (e) => { e.stopPropagation(); addSibling(node); });
    actions.appendChild(sibBtn);
  }

  const delBtn = document.createElement('button');
  delBtn.className = 'del';
  delBtn.innerHTML = ICONS.trash;
  delBtn.title = '删除';
  let confirming = false, confirmTimer = null;
  delBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!confirming) {
      confirming = true;
      delBtn.classList.add('confirming');
      delBtn.title = '再次点击确认删除';
      confirmTimer = setTimeout(() => { confirming = false; delBtn.classList.remove('confirming'); delBtn.title = '删除'; }, 3000);
    } else {
      clearTimeout(confirmTimer);
      deleteNode(node);
    }
  });
  actions.appendChild(delBtn);
  card.appendChild(actions);

  card.addEventListener('click', (e) => {
    if (e.target === card || e.target === header || e.target === text) {
      if (hasChildren) toggleNode(node._id);
    }
  });

  wrap.appendChild(card);

  if (hasChildren && isExpanded) {
    wrap.appendChild(buildChildren(node, depth));
  }

  wrap.addEventListener('dragstart', onDragStart);
  wrap.addEventListener('dragover', onDragOver);
  wrap.addEventListener('dragend', onDragEnd);

  container.appendChild(wrap);
}

function renderTree() {
  treeEl.innerHTML = '';
  const rootWrap = document.createElement('div');
  rootWrap.className = 'node depth-0 root';
  rootWrap.dataset.id = data._id;
  const rootCard = document.createElement('div');
  rootCard.className = 'root-card';
  const rootText = document.createElement('span');
  rootText.className = 'card-text';
  rootText.innerHTML = highlight(data.content);
  rootText.addEventListener('dblclick', (e) => { e.stopPropagation(); startEdit(rootText, data); });
  rootCard.appendChild(rootText);

  const rootActions = document.createElement('div');
  rootActions.className = 'card-actions';
  const addRoot = document.createElement('button');
  addRoot.className = 'add-child';
  addRoot.innerHTML = ICONS.plus;
  addRoot.title = '添加子项';
  addRoot.addEventListener('click', (e) => { e.stopPropagation(); addChild(data); });
  rootActions.appendChild(addRoot);
  rootCard.appendChild(rootActions);
  rootWrap.appendChild(rootCard);
  treeEl.appendChild(rootWrap);

  const timeline = document.createElement('div');
  timeline.className = 'timeline';
  data.children.forEach(c => renderNode(c, 1, timeline));
  treeEl.appendChild(timeline);
}

function toggleNode(id) {
  if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
  renderTree();
}
function startEdit(textEl, node) {
  if (textEl.dataset.editing) return;
  const original = node.content;
  textEl.contentEditable = 'true';
  textEl.dataset.editing = '1';
  textEl.focus();
  const range = document.createRange();
  range.selectNodeContents(textEl);
  const sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(range);

  const finish = (save) => {
    if (!textEl.dataset.editing) return;
    textEl.removeEventListener('keydown', onKey);
    delete textEl.dataset.editing;
    textEl.contentEditable = 'false';
    const val = textEl.textContent.trim();
    if (save && val && val !== original) { node.content = val; saveData(); }
    renderTree();
  };
  const onKey = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { finish(false); }
  };
  textEl.addEventListener('keydown', onKey);
  textEl.addEventListener('blur', () => finish(true), { once: true });
}
function addChild(node) {
  node.children.push({ content: '新知识点', children: [], payload: { tag: 'li', lines: '' } });
  expanded.add(node._id);
  saveData(); renderTree(); toast('已添加子项');
}
function addSibling(node) {
  const parent = findParent(data, node._id);
  if (!parent) return;
  const idx = parent.children.findIndex(c => c._id === node._id);
  parent.children.splice(idx + 1, 0, { content: '新知识点', children: [], payload: { tag: 'li', lines: '' } });
  if (parent._id) expanded.add(parent._id);
  saveData(); renderTree(); toast('已添加同级');
}
function deleteNode(node) {
  if (node._id === data._id) { toast('根节点不可删除'); return; }
  const parent = findParent(data, node._id);
  if (!parent) return;
  parent.children = parent.children.filter(c => c._id !== node._id);
  saveData(); renderTree(); toast('已删除');
}

let draggingEl = null;
function onDragStart(e) {
  draggingEl = e.currentTarget;
  draggingEl.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', draggingEl.dataset.id); } catch (err) {}
}
function onDragOver(e) {
  e.preventDefault();
  const target = e.currentTarget;
  if (!draggingEl || target === draggingEl) return;
  if (target.dataset.parentId !== draggingEl.dataset.parentId) return;
  e.dataTransfer.dropEffect = 'move';
  const rect = target.getBoundingClientRect();
  const after = e.clientY > rect.top + rect.height / 2;
  if (after) target.after(draggingEl); else target.before(draggingEl);
}
function onDragEnd() {
  if (!draggingEl) return;
  draggingEl.classList.remove('dragging');
  const parentId = draggingEl.dataset.parentId;
  const container = draggingEl.parentElement;
  const order = Array.from(container.children).map(el => el.dataset.id).filter(Boolean);
  const parent = parentId === 'root' ? data : findById(data, parentId);
  if (parent) {
    parent.children = order.map(id => findById(data, id)).filter(Boolean);
    saveData();
  }
  draggingEl = null;
  renderTree();
}

const searchInput = document.getElementById('search');
searchInput.addEventListener('input', () => {
  searchTerm = searchInput.value.trim().toLowerCase();
  autoExpand = new Set();
  if (searchTerm) {
    (function collect(node, path) {
      if (node.content.toLowerCase().includes(searchTerm)) {
        path.forEach(p => autoExpand.add(p._id));
      }
      node.children.forEach(c => collect(c, [...path, node]));
    })(data, []);
  }
  renderTree();
});

function exportJSON() {
  const blob = new Blob([JSON.stringify(strip(data), null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'it_knowledge_tree.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('已导出 JSON');
}
function importJSON(obj) {
  if (!obj || typeof obj.content !== 'string' || !Array.isArray(obj.children)) {
    toast('无效的数据结构'); return;
  }
  data = normalize(obj, null);
  expanded.clear(); saveData(); renderTree(); toast('导入成功');
}

document.getElementById('btnSave').onclick = () => { saveData(); toast('已保存到本地'); };
document.getElementById('btnExport').onclick = exportJSON;
document.getElementById('btnImport').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { try { importJSON(JSON.parse(reader.result)); } catch (err) { toast('JSON 解析失败'); } };
  reader.readAsText(file);
  e.target.value = '';
});
document.getElementById('btnReset').onclick = () => {
  confirmDialog('确定要重置为默认数据吗？当前修改将丢失。', () => {
    data = normalize(JSON.parse(JSON.stringify(DEFAULT_DATA)), null);
    expanded.clear(); saveData(); renderTree(); toast('已重置默认');
  });
};

const dropOverlay = document.getElementById('dropOverlay');
let dragDepth = 0;
window.addEventListener('dragenter', (e) => {
  if (hasFiles(e)) { dragDepth++; dropOverlay.classList.add('show'); }
});
window.addEventListener('dragleave', (e) => {
  if (hasFiles(e)) { dragDepth--; if (dragDepth <= 0) { dragDepth = 0; dropOverlay.classList.remove('show'); } }
});
window.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('drop', (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0; dropOverlay.classList.remove('show');
  const file = e.dataTransfer.files[0];
  if (!file || !/\.json$/i.test(file.name)) { toast('请拖入 .json 文件'); return; }
  const reader = new FileReader();
  reader.onload = () => { try { importJSON(JSON.parse(reader.result)); } catch (err) { toast('JSON 解析失败'); } };
  reader.readAsText(file);
});
function hasFiles(e) {
  return e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
}

data = loadData();
renderTree();
</script>
</body>
